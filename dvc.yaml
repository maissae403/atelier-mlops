stages:
  train:
    cmd: python src/train.py

    deps:
      - src/train.py
      - data/raw/iris.csv

    params:
      - train.n_estimators
      - train.max_depth
      - train.random_state
      - train.test_size

    outs:
      - models/model.pkl

    metrics:
      - reports/metrics.json:
          cache: false

  train_knn:
    cmd: python src/train_knn.py

    deps:
      - src/train_knn.py
      - data/raw/iris.csv

    outs:
      - models/knn_model.pkl

    metrics:
      - reports/knn_metrics.json:
          cache: false